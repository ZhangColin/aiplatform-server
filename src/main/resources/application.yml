server:
  port: 8888

spring:
  application:
    name: aiplatform-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    table: aiplatform-server_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  # 分页统一 1 基（ADR-0001：请求/响应均 1 基，默认 size=20）
  data:
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 20

# 机机调用签名（cartisan-openapi；与用户会话无关，ADR-0001）；
# 默认枚举 Controller 关闭（扫描包默认 com.cartisan/com.example，用不到，避免契约噪音）
cartisan:
  web:
    enum-controller:
      enabled: false
  openapi:
    self:
      app-id: ${OPENAPI_APP_ID:}
      app-secret: ${OPENAPI_APP_SECRET:}
    apikey-service-url: https://openapi.aieducenter.com/api/v1/api-keys/by-appId

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
